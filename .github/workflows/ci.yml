name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Validate example
        run: ecg validate examples/customer-country-change.yaml
      - name: Run impact example
        run: ecg impact examples/customer-country-change.yaml --change CR-142 --format json > /tmp/impact.json
      - name: Run graph diff example
        run: ecg diff examples/diff-before.yaml examples/diff-after.yaml --format json > /tmp/diff.json
      - name: Run governance gate example
        run: ecg gate examples/customer-country-change.yaml --change CR-142 --max-affected 20 --min-tests 2 --min-owners 2
