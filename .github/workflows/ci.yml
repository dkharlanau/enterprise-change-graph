name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Validate example
        run: ecg validate examples/customer-country-change.yaml
      - name: Impact and report
        run: |
          ecg impact examples/customer-country-change.yaml --change CR-142 --format json > /tmp/impact.json
          ecg report examples/customer-country-change.yaml --change CR-142 --output /tmp/impact.md
      - name: Diff and removal-aware review
        run: |
          ecg diff examples/diff-before.yaml examples/diff-after.yaml --format json > /tmp/diff.json
          ecg review examples/diff-before.yaml examples/diff-after.yaml --format markdown --output /tmp/review.md
      - name: Governance policy
        run: ecg gate examples/customer-country-change.yaml --change CR-142 --policy policies/baseline.yaml
      - name: Golden SAP graph
        run: |
          ecg validate examples/sap-customer-master/golden-graph.yaml
          ecg report examples/sap-customer-master/golden-graph.yaml --change SAP-CR-001 --output /tmp/sap-impact.md
          ecg release examples/sap-customer-master/golden-graph.yaml --change SAP-CR-001 --change SAP-CR-002 --format json > /tmp/release.json
      - name: Agent context
        run: ecg context examples/customer-country-change.yaml --change CR-142 > /tmp/context.json
